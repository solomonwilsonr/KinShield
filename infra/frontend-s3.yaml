AWSTemplateFormatVersion: "2010-09-09"
Description: KinShield Tier-1 frontend -- S3 static website (public), no CloudFront.
  Used because the account is not yet verified for CloudFront. Swap to CloudFront once verified.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "kinshield-site-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::kinshield-site-${AWS::AccountId}/*"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  WebsiteUrl:
    Value: !GetAtt SiteBucket.WebsiteURL
